# This machine has ~6 GB of RAM. A 4 GB heap plus a separate Kotlin daemon
# exhausted it and crashed the JVM mid-build, so the build is sized to fit:
# one Gradle worker, Kotlin compiled inside the Gradle daemon.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Kotlin's incremental cache stores paths relative to the project. Plugin
# sources live in the pub cache on C: while this project is on D:, and
# relativising across Windows drive roots throws — which fails the release
# build in the Kotlin daemon. Non-incremental compilation sidesteps it.
kotlin.incremental=false
